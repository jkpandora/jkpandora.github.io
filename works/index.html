<!DOCTYPE html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>ผลงานนักเรียน | JK Pandora</title>
<style>body{font-family:system-ui,sans-serif;max-width:960px;margin:auto;padding:24px;background:#fafafa;color:#222}
h1{margin:0 0 20px}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.c{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:16px}.c h3{margin:0 0 8px}
.c p{color:#555;font-size:14px}.c a{margin-right:12px}.d{color:#999;font-size:12px}</style></head>
<body><h1>ผลงานนักเรียนคอร์ส AI</h1><div class="g" id="g">กำลังโหลด…</div>
<script>fetch('works.json?'+Date.now()).then(r=>r.json()).then(ws=>{const e=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.getElementById('g').innerHTML=ws.map(w=>`<div class="c"><h3>${e(w.name)}</h3><p>${e(w.desc)}</p>
${w.url?`<a href="${e(w.url)}" target="_blank">ดูผลงาน</a>`:''}${w.download?`<a href="${e(w.download)}" target="_blank">ดาวน์โหลด</a>`:''}
<div class="d">${e(w.date)}</div></div>`).join('')||'ยังไม่มีผลงาน'})</script></body></html>
